name: CTGAN integration smoke

on:
  workflow_dispatch:
  push:
    paths:
      - "src/causal_utility/synthesize.py"
      - "tests/test_ctgan_optional.py"
      - "pyproject.toml"
      - ".github/workflows/ctgan-smoke.yml"

jobs:
  ctgan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install with CTGAN
        run: pip install -e ".[dev,ctgan]"
      - name: Run CTGAN integration test
        run: pytest tests/test_ctgan_optional.py -q
